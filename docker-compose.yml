# Local run of the full Voting App, using the same hardened images CI builds.
#   cp .env.example .env      # then set a password
#   docker compose up --build
# Vote:   http://localhost:8080
# Result: http://localhost:8081

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}

services:
  vote:
    build:
      context: ./vote
      target: final
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks: [front-tier, back-tier]

  result:
    build: ./result
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-postgres}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks: [front-tier, back-tier]

  worker:
    build: ./worker
    environment:
      <<: *db-env
      REDIS_HOST: redis
      POSTGRES_HOST: db
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks: [back-tier]

  redis:
    image: redis:7.4.12-alpine
    volumes:
      - "./healthchecks:/healthchecks:ro"
    healthcheck:
      test: /healthchecks/redis.sh
      interval: "5s"
    networks: [back-tier]

  db:
    image: postgres:16.15-alpine
    environment: *db-env
    volumes:
      - "db-data:/var/lib/postgresql/data"
      - "./healthchecks:/healthchecks:ro"
    healthcheck:
      test: /healthchecks/postgres.sh
      interval: "5s"
    networks: [back-tier]

  # Optional: seed 3000 votes with `docker compose --profile seed up -d`
  seed:
    build: ./seed-data
    profiles: ["seed"]
    depends_on:
      vote:
        condition: service_healthy
    networks: [front-tier]
    restart: "no"

volumes:
  db-data:

networks:
  front-tier:
  back-tier:
