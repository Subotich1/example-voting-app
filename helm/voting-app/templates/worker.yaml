apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        {{- include "voting-app.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: {{ include "voting-app.image" (dict "root" . "name" "worker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: REDIS_HOST, value: redis }
            - { name: POSTGRES_HOST, value: db }
            - { name: POSTGRES_DB, value: {{ .Values.database.name | quote }} }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: POSTGRES_PASSWORD }
            # Turn off .NET diagnostic pipes (not needed, and keeps the read-only root clean)
            - { name: DOTNET_EnableDiagnostics, value: "0" }
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- include "voting-app.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
