apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  labels:
    app: result
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.result.replicas }}
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
        {{- include "voting-app.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: result
          image: {{ include "voting-app.image" (dict "root" . "name" "result") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: PGHOST, value: db }
            - { name: PGDATABASE, value: {{ .Values.database.name | quote }} }
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: POSTGRES_USER }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: POSTGRES_PASSWORD }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.result.resources | nindent 12 }}
          securityContext:
            {{- include "voting-app.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: result
  labels:
    app: result
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.result.service.type }}
  selector:
    app: result
  ports:
    - name: http
      port: {{ .Values.result.service.port }}
      targetPort: http
