apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  labels:
    app: db
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
        {{- include "voting-app.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70       # "postgres" user in the official alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ .Values.db.image }}
          env:
            - { name: POSTGRES_DB, value: {{ .Values.database.name | quote }} }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.database.existingSecret }}, key: POSTGRES_PASSWORD }
            # Sub-directory avoids the "lost+found" folder at the root of a new EBS volume
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""] }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - { name: run, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.db.storage.storageClassName }}
        storageClassName: {{ .Values.db.storage.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.db.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    app: db
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  selector:
    app: db
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
