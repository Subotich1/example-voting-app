apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  labels:
    app: vote
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.vote.replicas }}
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
        {{- include "voting-app.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: vote
          image: {{ include "voting-app.image" (dict "root" . "name" "vote") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: REDIS_HOST, value: redis }
            - { name: OPTION_A, value: {{ .Values.vote.optionA | quote }} }
            - { name: OPTION_B, value: {{ .Values.vote.optionB | quote }} }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.vote.resources | nindent 12 }}
          securityContext:
            {{- include "voting-app.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: vote
  labels:
    app: vote
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.vote.service.type }}
  selector:
    app: vote
  ports:
    - name: http
      port: {{ .Values.vote.service.port }}
      targetPort: http
